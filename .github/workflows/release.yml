name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          PYPI_VERSION="v$(python -c "import re, pathlib; m = re.search(r'^version\s*=\s*\"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.M); assert m, 'version not found in pyproject.toml'; print(m.group(1))")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PYPI_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match pyproject version ${PYPI_VERSION}."
            exit 1
          fi
          echo "Tag ${TAG_VERSION} matches pyproject version."

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]" ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Guard: only publish from the canonical repository on a v* tag push.
    if: >-
      github.repository == 'cdzzy/agentconfig' &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Check PyPI credentials are configured (secret guard)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN secret is not configured in repository settings."
            echo "Add it under Settings > Secrets and variables > Actions to enable publishing."
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
