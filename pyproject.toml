[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdzzy-agentconfig"
version = "2.3.0"
description = "Business-semantic driven AI agent configuration system. The missing layer between business users and AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "cdzzy" }]
keywords = ["ai-agent", "llm", "configuration", "business", "no-code", "mcp", "a2a"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
agentconfig = "agentconfig.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentconfig*"]
